services:
  - type: web
    name: brandshield-api
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: CORS_ORIGINS
        value: "https://brandshield.app,http://localhost:3000,http://localhost:5173"
